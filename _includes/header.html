        :root {

            --ral-1020: #999950;
            /* Style commun des cartes (fond crème, liseré olive) */

            --card-accent: #999950;
            --card-accent-dark: #7a7a3f;
            --card-shadow: 0 3px 10px rgba(90, 70, 30, 0.15);
        }

        html body {

        }

        html body > header {

        html body .hero,
